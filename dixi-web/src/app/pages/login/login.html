<app-navbar [showLogin]="false"></app-navbar>

<div class="login-page">
  <div class="login-container">
    <form [formGroup]="form" (ngSubmit)="submit()" class="login-card">
      <div class="card-header">
        <h2>Welcome Back</h2>
        <p>Login to your Dixi account</p>
      </div>

      <div class="form-group">
        <label for="identifier">Email or Phone</label>
        <div class="input-with-icon">
          <lucide-icon [img]="MailIcon" [size]="18"></lucide-icon>
          <input 
            id="identifier"
            formControlName="identifier" 
            placeholder="Login with email or phone" 
          />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
        </div>
        <div class="input-with-icon">
          <lucide-icon [img]="LockIcon" [size]="18"></lucide-icon>
          <input 
            id="password"
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="••••••••" 
          />
          <button 
            type="button" 
            class="toggle-password-btn" 
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            <lucide-icon [img]="showPassword() ? EyeOffIcon : EyeIcon" [size]="18"></lucide-icon>
          </button>
        </div>
      </div>

      @if (errorMessage()) {
        <p class="error-text">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="form.invalid" class="submit-btn">
        <span>Login</span>
        <lucide-icon [img]="LogInIcon" [size]="18"></lucide-icon>
      </button>
    </form>
  </div>
</div>
